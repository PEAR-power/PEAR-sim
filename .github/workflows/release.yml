name: release

# Manual: builds both distributions, checks their versions agree, and publishes
# to PyPI through trusted publishing (configure the PyPI projects for this
# repository and the `pypi` environment first). Nothing here runs on push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          python-version: "3.13.13"
      - name: Versions agree
        run: |
          core=$(uv run --no-project python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          shim=$(uv run --no-project python -c "import tomllib;print(tomllib.load(open('packaging/pear-sim-mcp/pyproject.toml','rb'))['project']['version'])")
          pin=$(uv run --no-project python -c "import tomllib;print(tomllib.load(open('packaging/pear-sim-mcp/pyproject.toml','rb'))['project']['dependencies'][0])")
          test "$core" = "$shim" && test "$pin" = "pear-sim[mcp]==$core"
      - name: Build
        run: |
          uv build --out-dir dist
          uv build packaging/pear-sim-mcp --out-dir dist
      - name: Publish
        run: uv publish dist/*
