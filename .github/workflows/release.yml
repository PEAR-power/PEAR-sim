name: release

# Manual: builds both distributions, checks their versions agree, and publishes
# them to PyPI through trusted publishing. Nothing here runs on push.
#
# Each PyPI project has its own GitHub environment: PyPI refuses two pending
# trusted publishers with the same (repository, workflow, environment), so
# pear-sim publishes from `pypi` and pear-sim-mcp from `pypi-mcp`. Both
# environments only deploy from main.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          python-version: "3.13.13"
      - name: Versions agree
        run: |
          core=$(uv run --no-project python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          shim=$(uv run --no-project python -c "import tomllib;print(tomllib.load(open('packaging/pear-sim-mcp/pyproject.toml','rb'))['project']['version'])")
          pin=$(uv run --no-project python -c "import tomllib;print(tomllib.load(open('packaging/pear-sim-mcp/pyproject.toml','rb'))['project']['dependencies'][0])")
          server=$(uv run --no-project python -c "import json;d=json.load(open('server.json'));print(d['version'], d['packages'][0]['version'])")
          test "$core" = "$shim" && test "$pin" = "pear-sim[mcp]==$core" && test "$server" = "$core $core"
      - name: Build
        run: |
          uv build --out-dir dist/core
          uv build packaging/pear-sim-mcp --out-dir dist/mcp
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-core:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
      - name: Publish pear-sim
        run: uv publish dist/core/*

  # pear-sim-mcp pins pear-sim==<version>, so it goes up only after pear-sim.
  publish-mcp:
    needs: publish-core
    runs-on: ubuntu-24.04
    environment: pypi-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
      - name: Publish pear-sim-mcp
        run: uv publish dist/mcp/*
