name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PEAR_SIM_UV_VERSION: "0.11.28"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.11.15", "3.13.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.PEAR_SIM_UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked environment
        run: uv sync --locked --extra dev
      - name: Unit and converter tests
        run: uv run pytest
      - name: Static checks
        run: uv run ruff check .
      - name: CLI smoke test
        run: uv run pear-sim simulate examples/buck.yaml --out runs/buck --json
      - name: Complementary PWM and human-report smoke
        run: |
          uv run pear-sim render examples/synchronous_buck_complementary.yaml --out artifacts/synchronous-buck --json
          uv run pear-sim simulate examples/synchronous_buck_complementary.yaml --out runs/synchronous-buck --json
          uv run pear-sim report runs/synchronous-buck --out reports/synchronous-buck --schematic artifacts/synchronous-buck/schematic.svg --json
      - name: Three-phase SPWM, harmonics, and human-report smoke
        run: |
          uv run pear-sim render examples/inverter_three_phase_spwm.yaml --out artifacts/inverter-spwm --json
          uv run pear-sim simulate examples/inverter_three_phase_spwm.yaml --out runs/inverter-spwm --json
          uv run pear-sim report runs/inverter-spwm --out reports/inverter-spwm --schematic artifacts/inverter-spwm/schematic.svg --json
      - name: Verified-run comparison smoke
        run: >-
          uv run pear-sim compare runs/buck runs/buck
          --profile examples/buck_compare_profile.json
          --out comparisons/buck-self --json
      - name: Bounded parameter-sweep smoke
        run: >-
          uv run pear-sim sweep parameter examples/buck.yaml
          --request examples/buck_parameter_sweep.json
          --out sweeps/buck-parameter --json
      - name: Canonical boost boundary evidence smoke
        run: >-
          uv run pear-sim sweep boost-boundary examples/boost.yaml
          --ratios 0.9,1,1.1 --out sweeps/boost-boundary --json
      - name: Canonical inverting buck-boost boundary evidence smoke
        run: >-
          uv run pear-sim sweep inverting-buck-boost-boundary
          examples/inverting_buck_boost.yaml
          --ratios 0.9,1,1.1 --out sweeps/inverting-buck-boost-boundary --json


  test-other-os:
    # Windows, macOS and ARM minutes are free on public repositories and billed
    # extra (or unavailable) on private ones, so these platforms run once the
    # repo is public.
    if: ${{ !github.event.repository.private }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, ubuntu-24.04-arm]
        python-version: ["3.13.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.PEAR_SIM_UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked environment
        run: uv sync --locked --extra dev
      - name: Unit and converter tests
        run: uv run pytest
      - name: Static checks
        run: uv run ruff check .
      - name: CLI smoke test
        run: uv run pear-sim simulate examples/buck.yaml --out runs/buck --json
      - name: Complementary PWM and human-report smoke
        run: |
          uv run pear-sim render examples/synchronous_buck_complementary.yaml --out artifacts/synchronous-buck --json
          uv run pear-sim simulate examples/synchronous_buck_complementary.yaml --out runs/synchronous-buck --json
          uv run pear-sim report runs/synchronous-buck --out reports/synchronous-buck --schematic artifacts/synchronous-buck/schematic.svg --json
      - name: Three-phase SPWM, harmonics, and human-report smoke
        run: |
          uv run pear-sim render examples/inverter_three_phase_spwm.yaml --out artifacts/inverter-spwm --json
          uv run pear-sim simulate examples/inverter_three_phase_spwm.yaml --out runs/inverter-spwm --json
          uv run pear-sim report runs/inverter-spwm --out reports/inverter-spwm --schematic artifacts/inverter-spwm/schematic.svg --json
      - name: Verified-run comparison smoke
        run: >-
          uv run pear-sim compare runs/buck runs/buck
          --profile examples/buck_compare_profile.json
          --out comparisons/buck-self --json
      - name: Bounded parameter-sweep smoke
        run: >-
          uv run pear-sim sweep parameter examples/buck.yaml
          --request examples/buck_parameter_sweep.json
          --out sweeps/buck-parameter --json
      - name: Canonical boost boundary evidence smoke
        run: >-
          uv run pear-sim sweep boost-boundary examples/boost.yaml
          --ratios 0.9,1,1.1 --out sweeps/boost-boundary --json
      - name: Canonical inverting buck-boost boundary evidence smoke
        run: >-
          uv run pear-sim sweep inverting-buck-boost-boundary
          examples/inverting_buck_boost.yaml
          --ratios 0.9,1,1.1 --out sweeps/inverting-buck-boost-boundary --json

  examples:
    # Every shipped example must still load and run: examples are documentation
    # that agents copy, and an example that rots silently teaches the wrong format.
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.PEAR_SIM_UV_VERSION }}
          python-version: "3.13.13"
          enable-cache: true
      - name: Install locked environment
        run: uv sync --locked --extra dev
      - name: Lint and run every example
        run: |
          for model in examples/*.yaml; do
            name=$(basename "$model" .yaml)
            uv run pear-sim lint "$model"
            uv run pear-sim simulate "$model" --out "runs/$name" --lean > /dev/null
          done

  rust-core:
    # The optional compiled kernel (rust/pear-sim-core): build it, then check
    # it against SciPy, the exact solution and the reference engine on every
    # example it supports.
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.PEAR_SIM_UV_VERSION }}
          python-version: "3.13.13"
          enable-cache: true
      - name: Install locked environment
        run: uv sync --locked --extra dev
      - name: Build the kernel
        run: uvx --from "maturin==1.16.0" maturin build --release --locked -m rust/pear-sim-core/Cargo.toml -o rust-dist
      - name: Install the kernel
        run: uv pip install rust-dist/*.whl
      - name: Kernel tests
        run: uv run --no-sync pytest tests/test_rust_core.py "tests/test_batch.py::test_rust_batch_ranks_like_the_reference_engine" "tests/test_sensitivity.py::test_sensitivity_on_the_compiled_kernel_matches_the_reference"
      - name: Every supported example on both engines
        run: |
          uv run --no-sync python scripts/rust_parity.py --tolerance 1e-12 --mode lean
          uv run --no-sync python scripts/rust_parity.py --tolerance 1e-12 --mode full

  ngspice-oracle:
    # Independent-engine evidence: the differential tests skip silently when no
    # ngspice binary is present, so this job installs one and makes them run.
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.PEAR_SIM_UV_VERSION }}
          python-version: "3.13.13"
          enable-cache: true
      - name: Install ngspice
        run: sudo apt-get update && sudo apt-get install -y ngspice
      - name: Install locked environment
        run: uv sync --locked --extra dev
      - name: Differential tests against ngspice (none may skip)
        run: uv run pytest tests/test_ngspice_oracle.py -rs | tee ngspice.log && ! grep -q SKIPPED ngspice.log

  ngspice-oracle-other-os:
    # The same differential tests on the other platforms. Kept as a separate job
    # so the required check named `ngspice-oracle` keeps its name. Each OS gets
    # ngspice from its own package manager; on Windows that is MSYS2, and the
    # adapter is pointed at the binary through PEAR_SIM_NGSPICE_BIN.
    if: ${{ !github.event.repository.private }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.PEAR_SIM_UV_VERSION }}
          python-version: "3.13.13"
          enable-cache: true
      - name: Install ngspice (Linux ARM)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ngspice
      - name: Install ngspice (macOS)
        if: runner.os == 'macOS'
        run: brew install ngspice
      - name: Install ngspice (Windows, MSYS2)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-ngspice
      - name: Point the adapter at the MSYS2 binary
        if: runner.os == 'Windows'
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: echo "PEAR_SIM_NGSPICE_BIN=$MSYS2_LOCATION/ucrt64/bin/ngspice.exe" >> "$GITHUB_ENV"
      - name: Install locked environment
        run: uv sync --locked --extra dev
      - name: Which ngspice
        run: uv run python -c "from pear_sim.oracle.ngspice import find_ngspice; import sys; b = find_ngspice(); print(b); sys.exit(b is None)"
      - name: Differential tests against ngspice (none may skip)
        run: uv run pytest tests/test_ngspice_oracle.py -rs | tee ngspice.log && ! grep -q SKIPPED ngspice.log

  package-install:
    # Install what a user would install — the built wheel and sdist, outside the
    # repository, through `uvx` — and use it: CLI on a model, and the MCP
    # launcher answering a real stdio session (tools, packaged examples, one
    # simulation). Python 3.11 is the oldest supported; the other jobs cover 3.13.
    if: ${{ !github.event.repository.private }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      UV_PYTHON: "3.11.15"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.PEAR_SIM_UV_VERSION }}
          python-version: "3.11.15"
      - name: Build both distributions
        run: |
          uv build --out-dir dist
          uv build packaging/pear-sim-mcp --out-dir dist
          ls -l dist
      - name: Install and run outside the repository
        run: |
          version=$(uv run --no-project python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          wheel=$(uv run --no-project python -c "import glob,pathlib;print(pathlib.Path(glob.glob('dist/pear_sim-*.whl')[0]).resolve())")
          sdist=$(uv run --no-project python -c "import glob,pathlib;print(pathlib.Path(glob.glob('dist/pear_sim-*.tar.gz')[0]).resolve())")
          shim=$(uv run --no-project python -c "import glob,pathlib;print(pathlib.Path(glob.glob('dist/pear_sim_mcp-*.whl')[0]).resolve())")
          wheel_uri=$(uv run --no-project python -c "import pathlib,sys;print(pathlib.Path(sys.argv[1]).as_uri())" "$wheel")
          smoke="$RUNNER_TEMP/package-smoke"
          mkdir -p "$smoke"
          cp examples/buck.yaml scripts/mcp_stdio_smoke.py "$smoke/"
          cd "$smoke"
          for dist in "$wheel" "$sdist"; do
            echo "::group::pear-sim from $(basename "$dist")"
            got=$(uvx --isolated --from "$dist" pear-sim --version)
            echo "$got"
            test "$got" = "pear-sim $version"
            uvx --isolated --from "$dist" pear-sim lint buck.yaml --json > /dev/null
            uvx --isolated --from "$dist" pear-sim simulate buck.yaml --out "run-$(basename "$dist")" --json > /dev/null
            echo "::endgroup::"
          done
          echo "::group::pear-sim-mcp over stdio"
          uv run --no-project python mcp_stdio_smoke.py -- \
            uvx --isolated --from "$shim" --with "pear-sim[mcp] @ $wheel_uri" pear-sim-mcp --workspace ws
          echo "::endgroup::"

  perf-shadow:
    # CPU-time benchmark of this pull request against its base, SHADOW MODE:
    # it reports in the job summary what a regression gate would have said and
    # never fails on the numbers. Why shadow: there is no history of runner
    # noise to set a threshold from, and each run prints its own A/A noise
    # floor next to the result. Turn it into a gate only from recorded data
    # (artifacts below), and only once head/base regressions are separable
    # from the A/A spread. Not a required check.
    if: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
      ROUNDS: "6"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: head
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.PEAR_SIM_UV_VERSION }}
          python-version: "3.13.13"
          enable-cache: true
          cache-dependency-glob: head/uv.lock
      - name: Install both checkouts (runtime only)
        run: |
          (cd base && uv sync --locked)
          (cd head && uv sync --locked)
      - name: Interleaved measurement
        # Same inputs (the base examples) for both sides; the order alternates
        # every round so neither side always runs on a warmer machine.
        run: |
          for round in $(seq 1 "$ROUNDS"); do
            if [ $((round % 2)) -eq 1 ]; then order="base head"; else order="head base"; fi
            for side in $order; do
              "$side/.venv/bin/python" head/scripts/perf_cpu.py measure \
                --label "$side" --round "$round" --examples base/examples --out perf.jsonl
            done
          done
      - name: Compare (shadow mode, never fails on the numbers)
        run: >-
          head/.venv/bin/python head/scripts/perf_cpu.py compare perf.jsonl
          --base base --head head --json-out perf-result.json
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Keep the measurements for setting a threshold later
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-shadow-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: |
            perf.jsonl
            perf-result.json
          if-no-files-found: warn
          retention-days: 90

  secrets-scan:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fallback: the API asset path can work while releases/download returns 504.
          # The checksum below runs on whichever file was obtained — never skip it.
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            || gh release download v8.30.1 -R gitleaks/gitleaks -p gitleaks_8.30.1_linux_x64.tar.gz -O gitleaks.tar.gz --clobber
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose .
