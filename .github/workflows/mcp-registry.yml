name: mcp-registry

# Publishes server.json to the MCP registry (registry.modelcontextprotocol.io).
# Runs from GitHub Actions because the io.github.PEAR-power/* namespace needs
# proof of the organization: the interactive `mcp-publisher login github`
# cannot read organization roles (HTTP 403), the Actions OIDC token can.
# The PyPI package named in server.json must already be published.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: "1.8.8"
      MCP_PUBLISHER_SHA256: "09f1fa70ee146b640584274a1a6b2b8a0310b05d4321fa9224e6df6a016d67f4"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install mcp-publisher (pinned, checksum verified)
        run: |
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "$archive" mcp-publisher
      - name: Validate
        run: ./mcp-publisher validate
      - name: Log in with the Actions OIDC token
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish
