known_limitations:
- Soft switching (ZVS) holds only inside a window of load and voltage ratio; outside it the
  bridges hard-switch and the losses step up rather than drift up.
- Away from the matched voltage ratio the circulating current grows and the conduction losses
  with it — the topology punishes wide voltage ranges under single phase shift.
- Power transfer is set by the transformer LEAKAGE inductance, so the design depends on a
  parasitic that manufacturing tolerances move.
- The stored cycle is ONE phase-shift operating point; the mode sequence changes with phase
  shift, and the engine's derivatives are valid only while it holds.
- Magnetising saturation, dead-time detail and synchronous-rectifier timing are outside the
  kernel's declared scope (isolated DC-DC review, section 11).
