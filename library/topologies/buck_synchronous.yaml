kernel_support:
  status: simulated
  note: Runs on the reference kernel including the complementary pair with declared dead time;
    the dead-time intervals appear as their own steps in the stored cycle.
known_limitations:
- Dead time is mandatory against shoot-through, and during it the body diode conducts — the
  loss the synchronous rectifier was meant to remove partly returns, scaling with switching
  frequency.
- Being bidirectional, the stage can pull current OUT of the load at light load (negative
  inductor current) unless the control forbids it; that is a feature for regulation and a
  hazard for a battery.
- Step-down only, and the switch still sees the full input voltage.
- Two gate drives, one of them high-side referenced — more expensive and more failure-prone
  than a diode rectifier.
- No isolation.
template:
