kernel_support:
  status: simulated
  note: Runs on the reference kernel. Notably, the gradient engine solves this topology on
    an invariant subspace in a regime where the production shooting solver does not work at
    all. No comparison against an independent simulation engine exists for this entry.
known_limitations:
- 'Gain is controlled by frequency and is NOT monotone across the whole range: operating below
  the resonant frequency risks the capacitive region, where the bridge hard-switches into
  its own body diodes — a device-destroying failure mode, not a performance penalty.'
- Regulation degrades badly at no load and the topology has no inherent short-circuit control;
  a protection scheme is part of the design, not an option.
- Behaviour depends strongly on the Lm/Lr ratio and on resonant-component tolerances, which
  shift the whole gain curve.
- The stored cycle is a single above-resonance operating point.
- High-frequency magnetic losses and burst-mode operation are outside the kernel's declared
  scope.
template:
