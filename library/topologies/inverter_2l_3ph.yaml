kernel_support:
  status: simulated
  note: Runs on the reference kernel with a floating-neutral load (floating-star DAE reduction). No
    comparison against an independent simulation engine exists for this entry. The stored
    cycle is the SIX-STEP one, which is the modulation-independent cycle of this bridge.
known_limitations:
- The stored cycle is six-step. A PWM-modulated cycle is not a property of the topology alone
  — it depends on carrier ratio, modulation index and load — so no PWM cycle is stored here.
- 'Two output levels mean full-bus dv/dt at every commutation: motor insulation stress, bearing
  currents and EMI filtering are design constraints, not afterthoughts.'
- Dead time is mandatory against shoot-through and it distorts the output; at 500 ns and 21
  kHz the measured fundamental loss is about 1.4 %.
- Common-mode voltage steps between +-Vdc/6 and +-Vdc/2 — relevant wherever a common-mode
  path exists.
- 'No isolation: the DC bus and the load share a reference.'
template:
  model: examples/inverter_three_phase_six_step.yaml
notes: 'Third stage of the drive chain, and the same netlist serves as an ACTIVE FRONT END
  when the control layer changes (control is a separate layer of the system graph, not
  an attribute of the topology). A separate bidirectional AFE entry is deliberately NOT shipped
  yet: its natural reference model (examples/grid_following_converter.yaml) costs about 105
  s per run, which is too expensive for the per-commit re-extraction gate. Ranges are the
  entry author''s judgement, before review.'
