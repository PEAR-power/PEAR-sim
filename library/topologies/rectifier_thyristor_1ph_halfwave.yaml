kernel_support:
  status: simulated
  note: 'Runs on the reference kernel, including the latch: the device keeps conducting after
    the gate pulse ends and turns off only at the current zero. NOTE: the thyristor has no
    independent oracle yet, so this entry rests on kernel-internal evidence.'
known_limitations:
- Half-wave rectification injects a DC component into the supply current, which saturates
  a feeding transformer — the arrangement is a teaching and small-load circuit, not a power
  front end.
- Output ripple is enormous and the ripple frequency equals the line frequency, so filtering
  is expensive.
- Displacement power factor collapses as the firing angle grows; control range is bought with
  reactive power.
- 'Turn-off is not commandable: the device conducts until the current reaches zero, so the
  load inductance sets the conduction window.'
- Single phase only; no isolation.
template:
  model: examples/thyristor_phase_controlled.yaml
notes: Present because phase control is a distinct family the selection engine must be able
  to reject explicitly, not because it is a recommended front end. Ranges are the entry author's
  judgement.
