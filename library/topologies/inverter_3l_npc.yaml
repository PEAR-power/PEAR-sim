kernel_support:
  status: simulated
  note: Runs on the reference kernel with the level-shifted PD modulator and a capacitive
    split link. No comparison against an independent simulation engine exists for this entry.
known_limitations:
- 'Midpoint balance is an OPEN claim: this entry models the split link and measures the drift,
  but ships no active balancing control, so long-run midpoint behaviour is not guaranteed.'
- Loss distribution between outer and inner devices is uneven — the outer devices switch while
  the inner ones conduct — so thermal design cannot assume symmetry.
- 'Twice the switch count of a two-level bridge plus the clamp diodes: more gate drives, more
  failure modes, more cost.'
- Requires a split DC link; a single stiff source is not a valid substitute once midpoint
  current matters.
- Clamp-path conduction adds losses that grow with switching frequency, which is why this
  topology is usually a low-f_sw, high-power choice.
template:
  model: examples/npc_three_phase_midpoint.yaml
notes: Alternative for the inverter slot when bus voltage or output quality rules out two
  levels. Together with a three-level boost stage this is the 1500 V string-inverter architecture
  named as the first complete end-to-end product in the non-isolated DC-DC review; that boost
  stage is NOT yet in the library. Ranges are the entry author's judgement.
