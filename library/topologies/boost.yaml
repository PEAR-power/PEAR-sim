# Second entry of the topology library — added as DATA ONLY, with zero code
# changes; tests/test_topology_library.py pins that property (the 3.1
# acceptance criterion "adding a topology must not touch selection code").
# Sequence provenance and the re-extraction audit are the same as buck's.

schema: pear-sim/topology-entry/v0.1
id: boost
name: "Boost — non-isolated step-up converter"

prerequisites:
  isolation: none
  direction: unidirectional
  voltage:
    min_v: 1.0
    max_v: 1000.0
  power:
    min_w: 0.1
    max_w: 50000.0

mode_sequences:
  - label: ccm
    source_model: examples/boost.yaml
    sequence:
      schema: pear-sim/mode-sequence/v0.1
      period_s: 5.0e-05
      source_run_sha256: 63c91e235820f094c23194106c2082fd229a3821b1c4a9dd9a01b06d179311c6
      extraction_tolerance_s: 1.0e-12
      steps:
        - signature: gates[pwm=on];diodes[d1=off];constrained_inductors[none]
          gates: {pwm: true}
          diodes: {d1: false}
          constrained_inductors: []
          saturated_inductors: []
          exit: {kind: scheduled_gate, target: pwm, guard_is_current: false}
          nominal_duration_s: 2.5000000000000066e-05
        - signature: gates[pwm=off];diodes[d1=on];constrained_inductors[none]
          gates: {pwm: false}
          diodes: {d1: true}
          constrained_inductors: []
          saturated_inductors: []
          exit: {kind: period_end, target: '', guard_is_current: false}
          nominal_duration_s: 2.499999999999985e-05

kernel_support:
  status: simulated
  note: >-
    Runs on the reference kernel; the stored CCM cycle is re-extracted from examples/boost.yaml by the suite on every run.

known_limitations:
  - "No galvanic isolation; input and output share a ground reference."
  - "Step-up only, and the practical ratio is bounded (~4-5x) before
    parasitics collapse the ideal 1/(1-D) law."
  - "Right-half-plane zero in the control-to-output transfer function limits
    the achievable control bandwidth in CCM."
  - "No inherent short-circuit protection: the inductor-diode path connects
    input to output even with the switch permanently off."
  - "Output diode sees the full output voltage and the pulsed output current
    demands substantial output-side filtering; the stored CCM sequence stops
    being valid below the DCM boundary load."

template:
  model: examples/boost.yaml

notes: "Second library entry, added purely as data to pin the 3.1
  acceptance criterion."
