kernel_support:
  status: simulated
  note: 'Runs on the reference kernel. No comparison against an independent simulation
    engine exists for this entry. Also the first entry whose model is written with reusable
    subcircuits.'
known_limitations:
- Requires a phase-shifting transformer with two secondaries — the transformer is part of
  the topology, not an accessory, and it dominates cost, mass and footprint.
- Cancellation of the 5th and 7th harmonics is only as good as the supply balance and the
  matching of the two secondaries; an unbalanced grid degrades it and the 11th and 13th remain
  regardless.
- No output control and no regeneration path, exactly as the six-pulse bridge.
- The stored cycle is a healthy, balanced operating point; the entry makes no claim about
  behaviour under phase loss or deep unbalance.
template:
  model: examples/rectifier_12pulse_yyd.yaml
notes: 'Second variant for the rectifier slot of the drive chain: it buys harmonic performance
  with a transformer. Ranges are the entry author''s judgement, before review.'
