  note: Runs on the reference kernel; the stored line-frequency cycle is re-extracted from
    the transformer-fed example on every run. Coupled windings run as drawn.
known_limitations:
- 'No output control whatsoever: the DC level follows the line amplitude, so anything downstream
  must accept an unregulated bus or add a stage.'
- Unidirectional by construction — it cannot return braking or regenerated energy to the grid.
- Draws a strongly distorted line current (5th and 7th harmonics dominate); meeting IEEE 519
  / IEC 61000-3-x usually requires a filter, a higher pulse number, or an active front end.
- Commutation notches on the supply voltage scale with source inductance and can disturb other
  loads on the same bus.
- The DC ripple is at six times the line frequency, so the output filter is sized by the line
  period, not by a switching period.
- Isolation, when required, comes from the INPUT TRANSFORMER, not from the bridge — the entry
  is declared `optional` for that reason.
