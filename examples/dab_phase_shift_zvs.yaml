schema: pear-sim/v0.1
name: dab_phase_shift_zvs

# The Dual Active Bridge of examples/dab_phase_shift.yaml with a 200 ns dead time
# and the post-processed switching-transition check (docs/model-format.md §7c):
# does each bridge reach zero-voltage switching (ZVS) within the dead time, and if
# not, at what voltage do the incoming devices turn on and what does it cost.
#
# A full bridge swings BOTH legs in the same dead time (leg B is driven by the
# same control with the outputs swapped), so each bridge is ONE evaluation unit:
# `bridge_partner` integrates the two switching nodes on one commutation current.
# The commutation inductance is the leakage of the coupled pair referred to the
# switching side, L1·(1 − k²) = 2 mH · (1 − 0.95²) = 195 µH, and the rest of the
# path is the reflected winding voltage (M/L2)·v2 = 0.95·v(lsec) — the cantilever
# form of two coupled windings, exact for the declared pair. The primary series
# resistance (0.1 ohm) is left out of the transition (declared).
#
# CARD: SYNTHETIC. The Coss(V) table has the shape typical of a 650 V GaN HEMT but
# is not any part's datasheet; replace it with a real card before drawing design
# conclusions. Verified (closed form, ngspice), NOT validated.
#
# CLAIM BOUNDARY of the circuit itself: as in dab_phase_shift.yaml, plus a dead
# time during which the ideal antiparallel diodes carry the current (the node jumps
# instantly in the recorded run; the transition is post-processed, not fed back).

parameters:
  vin: 400 V
  fsw: 20 kHz
  phi: 4.1667 us      # 30 electrical degrees of the 50 us period
  lp: 2 mH
  ls: 2 mH
  k: 95 %
  rp: 100 milliohm
  cout: 20 uF
  load: 40 ohm

circuit:
  ground: gnd
  components:
    - {id: vin, type: voltage_source, p: dcp, n: gnd, value: "${vin}"}

    # Primary bridge. Leg A on (p.high, p.low); leg B antiphase by swap.
    - {id: qpah, type: ideal_switch, p: dcp, n: pa, control: p.high, initial: on}
    - {id: qpal, type: ideal_switch, p: pa, n: gnd, control: p.low, initial: off}
    - {id: dpah, type: diode, p: pa, n: dcp, initial: off}
    - {id: dpal, type: diode, p: gnd, n: pa, initial: off}
    - {id: qpbh, type: ideal_switch, p: dcp, n: pb, control: p.low, initial: off}
    - {id: qpbl, type: ideal_switch, p: pb, n: gnd, control: p.high, initial: on}
    - {id: dpbh, type: diode, p: pb, n: dcp, initial: off}
    - {id: dpbl, type: diode, p: gnd, n: pb, initial: off}

    # Transformer: leakage lives in k < 1.
    - {id: rprim, type: resistor, p: pa, n: pw, value: "${rp}"}
    - {id: lprim, type: inductor, p: pw, n: pb, value: "${lp}", initial_current: 0 A}
    - {id: lsec, type: inductor, p: sa, n: sb, value: "${ls}", initial_current: 0 A}

    # Secondary bridge, phase-shifted by phi. Same leg-swap construction.
    - {id: qsah, type: ideal_switch, p: outp, n: sa, control: s.high, initial: on}
    - {id: qsal, type: ideal_switch, p: sa, n: gnd, control: s.low, initial: off}
    - {id: dsah, type: diode, p: sa, n: outp, initial: off}
    - {id: dsal, type: diode, p: gnd, n: sa, initial: off}
    - {id: qsbh, type: ideal_switch, p: outp, n: sb, control: s.low, initial: off}
    - {id: qsbl, type: ideal_switch, p: sb, n: gnd, control: s.high, initial: on}
    - {id: dsbh, type: diode, p: sb, n: outp, initial: off}
    - {id: dsbl, type: diode, p: gnd, n: sb, initial: off}

    - {id: cout, type: capacitor, p: outp, n: gnd, value: "${cout}", initial_voltage: 250 V}
    - {id: rload, type: resistor, p: outp, n: gnd, value: "${load}"}

  couplings:
    - {inductors: [lprim, lsec], coupling: "${k}"}

controls:
  p:
    type: complementary_pwm
    frequency: "${fsw}"
    duty: 50 %
    phase: 0 s
    dead_time: 200 ns
  s:
    type: complementary_pwm
    frequency: "${fsw}"
    duty: 50 %
    phase: "${phi}"
    dead_time: 200 ns

switching_transitions:
  coss_cards:
    gan650_synthetic:
      voltage_axis_v: [0, 10, 50, 100, 200, 400, 650]
      coss_f: [1.5e-9, 6.0e-10, 2.0e-10, 1.2e-10, 8.0e-11, 6.5e-11, 5.5e-11]
      provenance:
        source: "SYNTHETIC — shape typical of a 650 V GaN HEMT, not a datasheet"
  legs:
    primary_a:
      high: qpah
      low: qpal
      high_diode: dpah
      low_diode: dpal
      card: gan650_synthetic
      bus_voltage: v(dcp)
      bridge_partner: primary_b
      commutation_inductance: 195 uH
      far_voltage: {v(lsec): 0.95}
      loop_inductance: 5 nH
      current_fall_time: 5 ns
    primary_b:
      high: qpbh
      low: qpbl
      high_diode: dpbh
      low_diode: dpbl
      card: gan650_synthetic
      bus_voltage: v(dcp)
    secondary_a:
      high: qsah
      low: qsal
      high_diode: dsah
      low_diode: dsal
      card: gan650_synthetic
      bus_voltage: v(outp)
      bridge_partner: secondary_b
      commutation_inductance: 195 uH
      far_voltage: {v(lprim): 0.95}
    secondary_b:
      high: qsbh
      low: qsbl
      high_diode: dsbh
      low_diode: dsbl
      card: gan650_synthetic
      bus_voltage: v(outp)

analysis:
  transient:
    start: 0 s
    stop: 6 ms
    output_step: 0.25 us
    solver: radau
    rtol: 1.0e-8
    atol: 1.0e-10

outputs:
  - v(outp)
  - v(dcp)
  - v(lsec)
  - v(lprim)
  - i(qpah)
  - i(qpal)
  - i(dpah)
  - i(dpal)
  - i(qpbh)
  - i(qpbl)
  - i(dpbh)
  - i(dpbl)
  - i(qsah)
  - i(qsal)
  - i(dsah)
  - i(dsal)
  - i(qsbh)
  - i(qsbl)
  - i(dsbh)
  - i(dsbl)
  - v(pa)
  - v(pb)
  - i(lprim)
  - i(lsec)
  - i(rload)
