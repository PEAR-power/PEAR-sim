# Showcase: two-segment saturable inductor. 10 V into 1 ohm + Lsat:
# unsaturated 1 mH until i_sat = 5 A (reached at t = ln(2) ms), then the
# incremental inductance drops to 0.2 mH and the current shoots to 10 A five
# times faster. The segment crossing is an exact restart event
# ("saturation_boundary" in events.jsonl), never smeared by the integrator.
schema: pear-sim/v0.1
name: rl_sat_inductor_step

circuit:
  ground: gnd
  components:
    - {id: vin, type: voltage_source, p: in, n: gnd, value: 10 V}
    - {id: r1, type: resistor, p: in, n: mid, value: 1 ohm}
    - id: lsat
      type: sat_inductor
      p: mid
      n: gnd
      value: 1 mH
      l_sat: 0.2 mH
      i_sat: 5 A
      initial_current: 0 A

analysis:
  transient:
    start: 0 s
    stop: 5 ms
    output_step: 2 us
    solver: dopri5
    rtol: 1.0e-10
    atol: 1.0e-12

outputs:
  - i(lsat)
  - v(mid)
