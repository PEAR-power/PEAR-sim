schema: pear-sim/v0.1
name: rectifier_6pulse_transformer

# Six-pulse diode bridge fed by a real transformer — the circuit that the
# coupled-winding zero-current reduction makes expressible AS DRAWN.
#
# Why it used to be impossible. A secondary phase terminal sits between one
# winding and two diodes. Between commutations both of those diodes block, so
# the winding's current cannot change: the branch has to be frozen and taken out
# of the differential state. The kernel could do that for a PLAIN inductor by
# replacing it with a 0 V branch, but 0 V is the wrong physics for a winding —
# an open transformer secondary shows the voltage its neighbours induce in it,
# which is the entire reason a transformer works. So the topology was refused,
# and every transformer-fed rectifier with it, six-pulse included.
#
# What it needs instead. With the frozen winding's di/dt pinned at zero, the
# windings that still carry current obey v_A = L_AA di_A/dt, and each frozen one
# shows v_f = L_fA inv(L_AA) v_A on its open terminals. The star point of the
# three secondaries needs the same treatment one level up: its KCL row is a
# state invariant rather than an equation, so it is replaced by the invariant's
# derivative — with the MUTUAL terms carried, not just the self inductances.
#
# NOTE ON THE GROUND TIE. `rtie` is not a workaround for the kernel; it is the
# reference an isolated secondary system genuinely needs. With every diode
# blocking, a floating secondary star has no defined common mode — that is
# physics, not a limitation, and a real installation earths the DC side
# somewhere. Remove it and the model is legitimately unsolvable.
#
# Measured (last 10 ms of a 20 ms run), against the same circuit carrying the
# 50 kohm winding shunts the twelve-pulse example still declares:
#   I_load  = 22.9688 A both ways
#   ripple  = 1.4550 A at 300 Hz and 0.4256 A at 600 Hz both ways
# The shunted variant reports more natural events (18 vs 13) because the shunts
# themselves commutate; the load sees the same current to four decimals, which
# is what "declared negligible" was always claiming and can now be checked.
#
# CLAIM BOUNDARY: ideal diodes, no core saturation or loss, stiff grid, and a
# leakage-only transformer model (k = 0.99 with no separate magnetizing branch).
# The 12.5 mH secondary makes the commutation overlap large on purpose — this is
# a reduction test, not a datasheet-accurate 400 V rectifier.

parameters:
  vph: 563 V
  fgrid: 50 Hz
  lp: 50 mH
  lsec: 12.5 mH      # half the primary turns
  k: 0.99
  rload: 20 ohm
  rtie: 1 megaohm    # earth reference for the isolated secondary system

circuit:
  ground: gnd
  components:
    - id: vga
      type: voltage_source
      p: ga
      n: gnd
      waveform: {type: sine, amplitude: "${vph}", frequency: "${fgrid}", phase_deg: 0}
    - id: vgb
      type: voltage_source
      p: gb
      n: gnd
      waveform: {type: sine, amplitude: "${vph}", frequency: "${fgrid}", phase_deg: -120}
    - id: vgc
      type: voltage_source
      p: gc
      n: gnd
      waveform: {type: sine, amplitude: "${vph}", frequency: "${fgrid}", phase_deg: 120}

    # Primary star, grounded.
    - {id: lpa, type: inductor, p: ga, n: gnd, value: "${lp}", initial_current: 0 A}
    - {id: lpb, type: inductor, p: gb, n: gnd, value: "${lp}", initial_current: 0 A}
    - {id: lpc, type: inductor, p: gc, n: gnd, value: "${lp}", initial_current: 0 A}

    # Secondary star with a FLOATING neutral — no shunt, no tie, nothing but
    # the three windings meeting at yn.
    - {id: lya, type: inductor, p: ya, n: yn, value: "${lsec}", initial_current: 0 A}
    - {id: lyb, type: inductor, p: yb, n: yn, value: "${lsec}", initial_current: 0 A}
    - {id: lyc, type: inductor, p: yc, n: yn, value: "${lsec}", initial_current: 0 A}

    # Six-pulse bridge.
    - {id: y1, type: diode, p: ya, n: ytop, initial: off}
    - {id: y2, type: diode, p: yb, n: ytop, initial: off}
    - {id: y3, type: diode, p: yc, n: ytop, initial: off}
    - {id: y4, type: diode, p: dcmid, n: ya, initial: off}
    - {id: y5, type: diode, p: dcmid, n: yb, initial: off}
    - {id: y6, type: diode, p: dcmid, n: yc, initial: off}

    - {id: rl, type: resistor, p: ytop, n: dcmid, value: "${rload}"}
    - {id: rtie, type: resistor, p: dcmid, n: gnd, value: "${rtie}"}

  couplings:
    - {inductors: [lpa, lya], coupling: "${k}"}
    - {inductors: [lpb, lyb], coupling: "${k}"}
    - {inductors: [lpc, lyc], coupling: "${k}"}

analysis:
  transient:
    start: 0 s
    stop: 20 ms
    output_step: 20 us
    solver: radau
    rtol: 1.0e-7
    atol: 1.0e-9

outputs:
  - v(ytop)
  - v(dcmid)
  - v(ya)
  - v(yn)
  - i(rl)
  - i(lpa)
  - i(lya)
