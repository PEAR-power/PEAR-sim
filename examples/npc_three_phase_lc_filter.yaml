schema: pear-sim/v0.1
name: npc_three_phase_lc_filter

# Three-level NPC inverter with an LC output filter — the inverter stage of a
# classic medium-voltage drive supply (MV transformer + 12-pulse rectifier +
# NPC with LC output filters). The same filter is commonly the plant through
# which a downstream current controller regulates load current.
#
# The filter is what the modal audit exists for: L_f and C_f put a lightly
# damped pole pair into every mode, and whether that matters depends on where
# it sits relative to the carrier band. Design placement here is the textbook
# one, f_fundamental << f_res << f_carrier:
#
#   f_res = 1 / (2*pi*sqrt(L_f*C_f)) = 1 / (2*pi*sqrt(1 mH * 100 uF)) = 503 Hz
#   fundamental 50 Hz, carrier 2 kHz -> the nearest excitation line is the
#   lowest carrier sideband at 2 kHz - 6*50 Hz = 1700 Hz.
#
# Damping comes only from the load resistance seen by the filter:
#   zeta = (1/(2*R)) * sqrt(L_f/C_f) = (1/(2*R)) * 3.162
# so a LIGHT load damps the filter LESS — the audit reports the value rather
# than assuming a design margin. Capacitor star point is tied to the DC
# midpoint (a floating filter star would leave the neutral undefined).

parameters:
  udc_half: 600 V
  fsw: 2 kHz
  ffund: 50 Hz
  mi: 90 %
  dead_time: 3 us
  lf: 1 mH
  cf: 100 uF
  rload: 5 ohm

circuit:
  ground: mid
  components:
    - {id: vp, type: voltage_source, p: dcp, n: mid, value: "${udc_half}"}
    - {id: vn, type: voltage_source, p: mid, n: dcn, value: "${udc_half}"}
    # Leg A
    - {id: q1a, type: ideal_switch, p: dcp, n: n1a, control: mod.a.outer_high}
    - {id: q2a, type: ideal_switch, p: n1a, n: pa, control: mod.a.inner_high}
    - {id: q3a, type: ideal_switch, p: pa, n: n2a, control: mod.a.inner_low}
    - {id: q4a, type: ideal_switch, p: n2a, n: dcn, control: mod.a.outer_low}
    - {id: d1a, type: diode, p: n1a, n: dcp, initial: off}
    - {id: d2a, type: diode, p: pa, n: n1a, initial: off}
    - {id: d3a, type: diode, p: n2a, n: pa, initial: off}
    - {id: d4a, type: diode, p: dcn, n: n2a, initial: off}
    - {id: d5a, type: diode, p: mid, n: n1a, initial: off}
    - {id: d6a, type: diode, p: n2a, n: mid, initial: off}
    # Leg B
    - {id: q1b, type: ideal_switch, p: dcp, n: n1b, control: mod.b.outer_high}
    - {id: q2b, type: ideal_switch, p: n1b, n: pb, control: mod.b.inner_high}
    - {id: q3b, type: ideal_switch, p: pb, n: n2b, control: mod.b.inner_low}
    - {id: q4b, type: ideal_switch, p: n2b, n: dcn, control: mod.b.outer_low}
    - {id: d1b, type: diode, p: n1b, n: dcp, initial: off}
    - {id: d2b, type: diode, p: pb, n: n1b, initial: off}
    - {id: d3b, type: diode, p: n2b, n: pb, initial: off}
    - {id: d4b, type: diode, p: dcn, n: n2b, initial: off}
    - {id: d5b, type: diode, p: mid, n: n1b, initial: off}
    - {id: d6b, type: diode, p: n2b, n: mid, initial: off}
    # Leg C
    - {id: q1c, type: ideal_switch, p: dcp, n: n1c, control: mod.c.outer_high}
    - {id: q2c, type: ideal_switch, p: n1c, n: pc, control: mod.c.inner_high}
    - {id: q3c, type: ideal_switch, p: pc, n: n2c, control: mod.c.inner_low}
    - {id: q4c, type: ideal_switch, p: n2c, n: dcn, control: mod.c.outer_low}
    - {id: d1c, type: diode, p: n1c, n: dcp, initial: off}
    - {id: d2c, type: diode, p: pc, n: n1c, initial: off}
    - {id: d3c, type: diode, p: n2c, n: pc, initial: off}
    - {id: d4c, type: diode, p: dcn, n: n2c, initial: off}
    - {id: d5c, type: diode, p: mid, n: n1c, initial: off}
    - {id: d6c, type: diode, p: n2c, n: mid, initial: off}
    # LC output filter per phase, capacitor star tied to the DC midpoint
    - {id: lfa, type: inductor, p: pa, n: fa, value: "${lf}", initial_current: 0 A}
    - {id: cfa, type: capacitor, p: fa, n: mid, value: "${cf}", initial_voltage: 0 V}
    - {id: rla, type: resistor, p: fa, n: mid, value: "${rload}"}
    - {id: lfb, type: inductor, p: pb, n: fb, value: "${lf}", initial_current: 0 A}
    - {id: cfb, type: capacitor, p: fb, n: mid, value: "${cf}", initial_voltage: 0 V}
    - {id: rlb, type: resistor, p: fb, n: mid, value: "${rload}"}
    - {id: lfc, type: inductor, p: pc, n: fc, value: "${lf}", initial_current: 0 A}
    - {id: cfc, type: capacitor, p: fc, n: mid, value: "${cf}", initial_voltage: 0 V}
    - {id: rlc, type: resistor, p: fc, n: mid, value: "${rload}"}

controls:
  mod:
    type: three_phase_npc_spwm
    carrier_frequency: "${fsw}"
    fundamental_frequency: "${ffund}"
    modulation_index: "${mi}"
    dead_time: "${dead_time}"

analysis:
  transient:
    start: 0 s
    stop: 40 ms
    output_step: 2 us
    solver: dopri5
    rtol: 1.0e-8
    atol: 1.0e-10

outputs:
  - v(pa)
  - v(fa)
  - v(fb)
  - i(lfa)
  - i(lfb)
  - i(lfc)
  - i(rla)
